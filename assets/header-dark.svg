<svg width="760" height="110" viewBox="0 0 760 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Varun Devaraj — On-Device AI/LLM Systems Engineer. Offline-first. Ships things.">
  <title>Varun Devaraj — On-Device AI/LLM Systems Engineer</title>
  <style>
    .name   { font: 700 34px ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace; }
    .tag    { font: 500 18px ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace; fill: #5eead4; }
    .cursor { fill: #5eead4; }
  </style>

  <defs>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
  </defs>

  <!-- soft breathing glow behind the name -->
  <text x="4" y="46" class="name" fill="#5eead4" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;0.8;0.35" keyTimes="0;0.5;1" dur="2.6s" repeatCount="indefinite"/>
    Varun Devaraj
  </text>

  <!-- chromatic-aberration ghosts, flash only during the glitch burst (two ~200ms pulses at 2.0s and 2.2s) -->
  <text x="-3" y="46" class="name" fill="#22d3ee" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0;0" keyTimes="0;0.40;0.42;0.44;0.46;0.48;1" dur="5s" repeatCount="indefinite"/>
    Varun Devaraj
  </text>
  <text x="11" y="46" class="name" fill="#f472b6" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0;0" keyTimes="0;0.40;0.42;0.44;0.46;0.48;1" dur="5s" repeatCount="indefinite"/>
    Varun Devaraj
  </text>

  <!-- crisp foreground text, dips + jitters briefly during the same burst so the split reads clearly -->
  <text x="4" y="46" class="name" fill="#e7e9ee">
    <animate attributeName="opacity" values="1;1;0.4;1;0.4;1;1" keyTimes="0;0.40;0.42;0.44;0.46;0.48;1" dur="5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -4,0; 3,0; -3,0; 0,0; 0,0"
      keyTimes="0; 0.40; 0.42; 0.44; 0.46; 1"
      dur="5s" repeatCount="indefinite"/>
    Varun Devaraj
  </text>

  <rect x="432" y="12" width="3" height="36" class="cursor">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <text x="6" y="84" class="tag">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.42;0.5;1" dur="8s" begin="0.3s" repeatCount="indefinite"/>
    On-Device AI/LLM Systems Engineer
  </text>
  <text x="6" y="84" class="tag">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.58;0.92;1" dur="8s" begin="0.3s" repeatCount="indefinite"/>
    Offline-first. Ships things.
  </text>
</svg>
